name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout fornax-docs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: checkout fornax-core (content source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: horonomy/fornax-core
          path: fornax-core

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: check for stale hostname references
        run: npm run check-docs

      - name: build
        env:
          FORNAX_CORE_PATH: ${{ github.workspace }}/fornax-core
        run: npm run build
